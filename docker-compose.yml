version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: familycare_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-familycare_db}
      POSTGRES_USER: ${DB_USER:-familycare_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-familycare_secure_password_2026}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-familycare_user} -d ${DB_NAME:-familycare_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
